name: Release
# Push a tag like v1.0.0 to build, test and publish MOIRE.COM.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: tests/run_tests.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v t="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" t "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" MOIRE.COM SHA256SUMS screenshot.jpg \
            --title "MOIRE $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
